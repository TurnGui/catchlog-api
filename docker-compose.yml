services:
  postgres:
    image: postgres:16
    container_name: catchlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catchlog
      POSTGRES_USER: catchlog_user
      POSTGRES_PASSWORD: catchlog_password
    ports:
      - "5544:5432"
    volumes:
      - catchlog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catchlog_user -d catchlog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: catchlog-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  api:
    build: .
    container_name: catchlog-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=catchlog;Username=catchlog_user;Password=catchlog_password"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: ${JWT_KEY:?JWT_KEY is not set}
    ports:
      - "8081:8080"

volumes:
  catchlog-postgres-data: